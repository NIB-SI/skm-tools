[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skm-tools"
authors = [
  { name="Carissa Bleker", email="carissa.bleker@nib.si" },
]
description = "Utilities for leveraging SKM (Stress Knowledge Map) resources"
keywords = ["systems biology", "plant stress", "knowledge graph", "network analysis"]
readme = "docs/README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3",
    "pandas>=2",
]

[project.optional-dependencies]
cytoscape = ["py4cytoscape"]
pdf = ["pypdf", "pdfCropMargins", "reportlab"]
# running the tutorials (tutorials/)
tutorials = ["matplotlib", "py4cytoscape", "ipykernel"]

# for development
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autoapi", "nbsphinx", "nbsphinx-link", "ipython"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["skm_tools*"]

[tool.setuptools.package-data]
skm_tools = ["resources/*.xml"]

[project.urls]
Homepage = "https://github.com/NIB-SI/skm-tools"
Documentation = "https://nib-si.github.io/skm-tools"
Repository = "https://github.com/NIB-SI/skm-tools"
Issues = "https://github.com/NIB-SI/skm-tools/issues"
