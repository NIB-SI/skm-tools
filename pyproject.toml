[tool.poetry]
name = "skm-tools"
version = "0.1.0"
description = "Utilities for leveraging SKM resources"
authors = ["Carissa Bleker <carissa.bleker@nib.si>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/NIB-SI/skm-tools"
packages = [{ include = "skm_tools" }]

[tool.poetry.dependencies]
python = "^3.9"
networkx = ">=2.8"
pandas = ">=1.4"

[tool.poetry.extras]
cytoscape = ["py4cytoscape"]
pdf = ["pypdf", "pdfCropMargins", "reportlab"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autoapi", "nbsphinx", "nbsphinx-link", "ipython"]

[tool.poetry.group.cytoscape.dependencies]
py4cytoscape = { version = "*", optional = true }

[tool.poetry.group.pdf.dependencies]
pypdf = { version = "*", optional = true }
pdfCropMargins = { version = "*", optional = true }
reportlab = { version = "*", optional = true }

[tool.poetry.group.docs.dependencies]
sphinx = { version = "*", optional = true }
sphinx-rtd-theme = { version = "*", optional = true }
sphinx-autoapi = { version = "*", optional = true }
nbsphinx = { version = "*", optional = true }
nbsphinx-link = { version = "*", optional = true }
ipython = { version = "*", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
